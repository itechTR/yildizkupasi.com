name: Update live football data

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-football-data
  cancel-in-progress: false

jobs:
  update-live-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync branch before generating data
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Update World Cup data
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: node scripts/update-live-data.mjs

      - name: Update multi-tournament platform feed
        env:
          PLATFORM_FEED_URL: ${{ secrets.PLATFORM_FEED_URL }}
          PLATFORM_FEED_TOKEN: ${{ secrets.PLATFORM_FEED_TOKEN }}
        run: node scripts/update-platform-data.mjs

      - name: Check official FIFA ranking publication
        run: node scripts/update-rankings.mjs

      - name: Generate intelligence files
        run: node scripts/generate-intelligence.mjs

      - name: Commit updated data
        run: |
          git config user.name "yildizkupasi-bot"
          git config user.email "actions@github.com"

          git add data/*.json platform/current.json platform/rankings.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update live football data and intelligence"
            git push origin main
          fi

      - name: Prepare public site
        run: |
          mkdir -p /tmp/public-site
          rsync -a --exclude='.git' --exclude='.github' --exclude='tests' --exclude='scripts' --exclude='*.md' --exclude='*.tmp' ./ /tmp/public-site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/public-site

  deploy:
    needs: update-live-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated site and scores
        id: deployment
        uses: actions/deploy-pages@v4
